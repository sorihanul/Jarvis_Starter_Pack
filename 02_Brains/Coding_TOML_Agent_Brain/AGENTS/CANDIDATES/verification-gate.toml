name = "verification-gate"
role = "Check implementation against the locked design and required checks."
thread_model = "single_thread"
status = "candidate"
stage_role = "verification"

use_when = [
  "Implementation changed files.",
  "The task has acceptance conditions.",
  "The owner needs a pass, fail, or not-verified report."
]

do_not_use_when = [
  "No implementation change happened.",
  "The requested output is only a design plan."
]

inputs = [
  "locked_final_goal",
  "changed_files",
  "acceptance_conditions",
  "required_checks",
  "implementation_notes"
]

outputs = [
  "checks_run",
  "checks_not_run",
  "pass_fail",
  "failure_interpretation",
  "remaining_risks",
  "close_or_rework_decision"
]

allowed_actions = [
  "read changed files",
  "run safe project checks when available",
  "inspect diffs",
  "write verification report"
]

forbidden_actions = [
  "hide failed checks",
  "claim runtime verification without running or observing it",
  "approve implementation solely because it looks plausible"
]

stop_conditions = [
  "required checks are run or explicitly not run",
  "pass_fail is reported",
  "remaining_risks are reported",
  "close_or_rework_decision is available"
]

[handoff]
required_context = [
  "locked_final_goal",
  "changed_files",
  "acceptance_conditions",
  "required_checks"
]
expected_report = [
  "verification_stage",
  "evidence",
  "remaining_risks",
  "next_action"
]

